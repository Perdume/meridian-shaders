[mod]
id = "hshader_options"
version = "0.1.0"
priority = 100

# The options of Horizon's own shader packs (.hshader, shader API 0.1), changed in game on this
# mod's page in Options > Mods. It hooks only the native hook points (hooks 1 in
# horizon-native.json), so the launcher builds it on any Horizon that has them; this is the commit
# it was tested on (Nightly 2026-10-30).
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

# Values, steps and the page's buttons: std and horizon_shader_api only (tested in
# mod/test-harness).
[[module]]
id = "logic"
file = "crates/horizon-client/src/game.rs"
name = "hshader_options_logic"
source = "logic.rs"

# The game side: when to build the pack with the player's values, the row and the page.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "hshader_options"
source = "runtime.rs"

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
