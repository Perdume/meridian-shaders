max = 1.0
step = 0.1

[[options]]
id = "tone_night"
name = "Night vision shift"
description = "Dark scenes turn bluer and less saturated, as eyes see at night."
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "aa_taa"
name = "Temporal AA"
description = "Steadies shimmering edges and leaves, and smooths shadow and AO grain."
type = "bool"
default = true

[[options]]
id = "aa_taa_blend"
name = "TAA strength"
description = "How much of past frames is kept: smoother but softer above."
type = "float"
default = 0.8
min = 0.5
max = 0.95
step = 0.1

