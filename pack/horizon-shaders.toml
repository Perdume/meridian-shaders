default = 0.3
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "tone_map"
name = "Tone map"
description = "How bright light rolls off: filmic ACES, a soft curve, or none."
type = "choice"
values = ["ACES", "Soft", "Off"]
default = "ACES"

[[options]]
id = "tone_exposure"
name = "Exposure"
description = "Overall brightness."
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.1

[[options]]
id = "tone_auto_exposure"
name = "Eye adaptation"
description = "The picture brightens in the dark and settles in sunlight, over a few seconds."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "tone_contrast"
name = "Contrast"
