default = 0.3
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_torch"
name = "Torch warmth"
description = "Orange light near torches and lanterns."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_colored"
name = "Coloured lights"
description = "Light sources colour their light: soul fire blue, redstone red, amethyst violet..."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_emissive"
name = "Glowing blocks"
description = "Lava, glowstone, sea lanterns and other shining blocks glow brighter."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.1

[[options]]
id = "light_foliage"
name = "Light through leaves"
description = "Leaves and grass glow when the sun is behind them, and don't darken facing away."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_wet"
name = "Wet surfaces"
description = "Ground darkens and turns glossy in the rain."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_biome"
name = "Biome mood"
description = "Light and haze take the biome's mood: bluer in snow, warmer in deserts, greener in swamps."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_cave"
name = "Cave brightness"
description = "A floor to how dark caves get (0: vanilla)."
type = "float"
default = 0.0
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_contrast"
name = "Light contrast"
description = "Darker shadows and caves above 1, flatter below."
type = "float"
default = 1.1
min = 0.7
max = 1.6
step = 0.1

[[options]]
id = "light_specular"
name = "Shine"
description = "Highlights and sky reflections on metal, glass, ice, wet ground and PBR textures."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "pbr_normals"
name = "PBR normal maps"
description = "Use a resource pack's LabPBR normal maps (_n) for relief."
type = "bool"
default = true

[[options]]
id = "pbr_specular"
name = "PBR specular maps"
description = "Use a resource pack's LabPBR specular maps (_s) for shine and metals."
type = "bool"
default = true

[[options]]
id = "shadow_strength"
name = "Shadows"
description = "Sun shadows of blocks, trees, the player and mobs, from the engine's shadow map."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "shadow_softness"
name = "Shadow softness"
description = "How soft the edges of shadows are."
type = "float"
default = 1.0
min = 0.0
max = 3.0
