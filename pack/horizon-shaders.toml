# Generated by tools/make_manifest.py: edit that, not this.
schema = 1
id = "meridian"
name = "Meridian"
version = "0.6.0"
api = "0.1"
description = "Shadow-mapped sun, scattered skies with stars and aurora, coloured block light, clear water with waves, caustics and reflections, PBR, ambient occlusion, bloom, depth of field, TAA and a filmic grade."
authors = ["Meridian contributors"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Atmosphere"

[material]
file = "material.wgsl"
files = ["lib/shadow.wgsl"]
name = "Lit surfaces"

[weather]
file = "weather.wgsl"

# The engine's shadow map, drawn from the sun (the moon by night) each frame.
[shadow]
resolution = 2048
distance = 128.0

# The water mirror, drawn while the option is on.
[reflection]
option = "water_mirror"

[[post]]
file = "post/shadows.wgsl"
files = ["lib/shadow.wgsl"]
name = "Shadows and AO"

[[post]]
file = "post/haze.wgsl"
name = "Air"

[[post]]
file = "post/rays.wgsl"
name = "Sun rays"

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom (half size)"
output = "glow"
scale = 0.5

[[post]]
file = "post/lens.wgsl"
name = "Lens"

[[post]]
file = "post/tonemap.wgsl"
name = "Tone map and grade"

[[post]]
file = "post/taa.wgsl"
name = "Temporal AA"

[[post]]
file = "post/sharpen.wgsl"
name = "Sharpen"

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = ["block/short_grass", "block/tall_grass_*", "block/fern", "block/large_fern_*", "block/*_sapling", "block/vine", "block/poppy", "block/dandelion", "block/*_tulip", "block/oxeye_daisy", "block/cornflower", "block/allium", "block/azure_bluet", "block/blue_orchid", "block/lily_of_the_valley", "block/sugar_cane", "block/kelp*", "block/seagrass", "block/tall_seagrass_*", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*", "block/dead_bush", "block/*_roots", "block/glow_lichen", "block/pink_petals", "block/bush", "block/firefly_bush", "block/leaf_litter"]

[[materials]]
id = 3
sprites = ["block/iron_block", "block/gold_block", "block/netherite_block", "block/*copper*", "block/iron_bars", "block/chain", "block/anvil*", "block/*_anvil*", "block/iron_door*", "block/iron_trapdoor"]

[[materials]]
id = 4
sprites = ["block/ice", "block/packed_ice", "block/blue_ice", "block/glass", "block/*_stained_glass", "block/tinted_glass", "block/glass_pane_top", "block/*_stained_glass_pane_top"]

[[lights]]
color = [1.0, 0.72, 0.42]
blocks = ["torch", "wall_torch", "lantern", "campfire", "fire", "jack_o_lantern", "furnace", "blast_furnace", "smoker"]

[[lights]]
color = [0.35, 0.8, 1.0]
blocks = ["soul_torch", "soul_wall_torch", "soul_lantern", "soul_campfire", "soul_fire"]

[[lights]]
color = [1.0, 0.25, 0.15]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.5, 0.15]
blocks = ["lava", "magma_block"]

[[lights]]
color = [1.0, 0.85, 0.6]
blocks = ["glowstone", "shroomlight"]

[[lights]]
color = [0.6, 0.95, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.75, 0.45, 1.0]
blocks = ["amethyst_cluster", "large_amethyst_bud", "medium_amethyst_bud", "crying_obsidian", "respawn_anchor", "end_rod", "end_portal", "nether_portal"]

[[lights]]
color = [0.55, 1.0, 0.6]
blocks = ["glow_lichen", "verdant_froglight", "sculk_catalyst", "sculk_sensor"]

[[lights]]
color = [1.0, 0.9, 0.55]
blocks = ["ochre_froglight"]

[[lights]]
color = [1.0, 0.6, 0.9]
blocks = ["pearlescent_froglight"]

[[lights]]
color = [1.0, 0.78, 0.5]
blocks = ["candle", "*_candle", "candle_cake", "*_candle_cake"]

[[options]]
id = "quality"
name = "Quality"
description = "Low: fastest (no AO, no caustics or foam). Medium. High: the default. Ultra: the smoothest shadows, AO, rays and bloom."
type = "choice"
values = ["Low", "Medium", "High", "Ultra"]
default = "High"

[[options]]
id = "sky_scatter"
name = "Sky scattering"
description = "How much of the scattered sky replaces vanilla's by day."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sky_halo"
name = "Sun halo"
description = "The bright haze around the sun."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sky_cirrus"
name = "High clouds"
description = "Thin streaky clouds high up, coloured at dusk."
type = "float"
default = 0.4
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sky_stars"
name = "Stars"
description = "Stars and the Milky Way at night."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "sky_aurora"
name = "Aurora"
description = "Northern lights over cold biomes at night."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_warmth"
name = "Sunlight warmth"
description = "Sunlit faces warm up, more so when the sun is low."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.1

[[options]]
id = "light_shade"
name = "Shade coolness"
description = "Faces turned away from the sun take the sky's blue."
